<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>레테의 무도회 코디 솔루션</title>
    <style>
        :root {
            --primary: #f39c12;
            --primary-dark: #d35400;
            --bg: #f8f9fa;
            --card-bg: #ffffff;
            --text: #2c3e50;
            --border: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px 10px;
        }

        .container {
            width: 100%;
            max-width: 520px;
            background: var(--card-bg);
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            padding: 25px 20px;
            position: relative;
        }

        .hidden { display: none !important; }

        /* --- [상단 레테 마네킹 & 대사 섹션] --- */
        .story-section {
            background: #fffaf0;
            border: 2px solid #fbd38d;
            border-radius: 16px;
            padding: 18px;
            margin-bottom: 20px;
            text-align: center;
        }

        .speech-bubble {
            background: #ffffff;
            border: 1.5px solid #ed8936;
            border-radius: 12px;
            padding: 12px 15px;
            font-size: 14.5px;
            font-weight: 700;
            color: #2d3748;
            line-height: 1.4;
            margin-bottom: 15px;
            position: relative;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .speech-bubble::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 8px 8px 0;
            border-style: solid;
            border-color: #ffffff transparent;
            display: block;
            width: 0;
        }

        .speech-bubble::before {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 10px 10px 0;
            border-style: solid;
            border-color: #ed8936 transparent;
            display: block;
            width: 0;
        }

        .avatar-box {
            width: 140px;
            height: 160px;
            margin: 0 auto;
            background: #edf2f7;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border: 2px solid var(--border);
        }

        .avatar-box img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* --- [하단 진행률 & 선택지] --- */
        .progress-bar {
            width: 100%;
            height: 8px;
            background: #edf2f7;
            border-radius: 4px;
            margin-bottom: 15px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: var(--primary);
            width: 0%;
            transition: width 0.3s ease;
        }

        .q-number {
            font-size: 13px;
            font-weight: 700;
            color: var(--primary-dark);
            margin-bottom: 4px;
        }

        .q-text {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 15px;
            line-height: 1.4;
        }

        .option-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 15px;
        }

        .image-card {
            border: 2px solid var(--border);
            border-radius: 12px;
            padding: 10px;
            background: #fff;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .image-card:hover {
            border-color: var(--primary);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(243, 156, 18, 0.15);
        }

        .image-card img {
            width: 100%;
            height: 95px;
            object-fit: contain;
            border-radius: 6px;
            margin-bottom: 6px;
            background-color: #f8fafc;
        }

        .image-card span {
            font-size: 12.5px;
            font-weight: 700;
            color: #2d3748;
        }

        .res-box {
            background: #f8fafc;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 15px;
            border: 1px solid #e2e8f0;
        }

        .res-box-title {
            font-size: 15px;
            font-weight: 700;
            margin-bottom: 8px;
            color: #2d3748;
        }

        .feedback-item {
            font-size: 13.5px;
            line-height: 1.5;
            margin-bottom: 8px;
            padding-left: 14px;
            position: relative;
        }

        .feedback-item::before {
            content: "•";
            position: absolute;
            left: 0;
            color: var(--primary);
            font-weight: bold;
        }

        .btn-action {
            width: 100%;
            padding: 15px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-action:hover { background: var(--primary-dark); }
    </style>
</head>
<body>

<div class="container">
    <!-- 레테 마네킹 & 대사 상단 영역 -->
    <div class="story-section">
        <div class="speech-bubble" id="rete-speech">
            "안녕? 난 레테야! 곧 무도회 참석 날짜가 다가오는데 이대로 갈 순 없지. 나를 아름답게 꾸며줄래?"
        </div>
        <div class="avatar-box">
            <!-- 레테 캐릭터 상단 실시간 변경 이미지 -->
            <img id="avatar-img" src="https://via.placeholder.com/140x160/edf2f7/2c3e50?text=Rete+Default" alt="레테 캐릭터">
        </div>
    </div>

    <!-- 질문 및 선택지 영역 -->
    <div id="quiz-container">
        <div class="progress-bar"><div id="progress" class="progress-fill"></div></div>
        <div id="qa-number" class="q-number">Step 1</div>
        <div id="qa-text" class="q-text">질문 불러오는 중...</div>
        <div id="qa-options" class="option-grid"></div>
    </div>

    <!-- 결과 화면 -->
    <div id="result-container" class="hidden">
        <div class="res-box">
            <div class="res-box-title" id="res-title">🎉 무도회 준비 완료!</div>
            <div id="res-content"></div>
        </div>
        <button class="btn-action" onclick="location.reload()">처음부터 다시 꾸미기</button>
    </div>
</div>

<script>
    // 질문 데이터 (각 선택지 선택 시 변경될 레테의 대사, 상단 이미지, 선택지 이미지 포함)
    const questions = [
        {
            q: "Q1. 헤어 스타일을 어떤 스타일로 바꿔볼까?",
            opts: [
                { 
                    t: "깔끔한 기본 헤어", 
                    c: 2, 
                    img: "https://via.placeholder.com/150/f8f9fa/2c3e50?text=Basic+Hair",
                    avatarImg: "https://via.placeholder.com/140x160/edf2f7/2c3e50?text=Rete+Basic+Hair",
                    speech: "오, 단정하고 차분한 느낌이네! 기본에 충실한 스타일도 나쁘지 않지."
                },
                { 
                    t: "인기 대세 헤어", 
                    c: 6, 
                    img: "https://via.placeholder.com/150/fffaf0/d35400?text=Popular+Hair",
                    avatarImg: "https://via.placeholder.com/140x160/fffaf0/d35400?text=Rete+Popular+Hair",
                    speech: "와! 요즘 제일 세련됐다고 소문난 헤어잖아? 마음에 쏙 들어!"
                },
                { 
                    t: "희소 마라벨 헤어", 
                    c: 18, 
                    img: "https://via.placeholder.com/150/f39c12/ffffff?text=Master+Label",
                    avatarImg: "https://via.placeholder.com/140x160/f39c12/ffffff?text=Rete+Master+Hair",
                    speech: "우와... 엄청 화려하다! 무도회에서 내가 제일 눈에 띨 것 같아!"
                }
            ]
        },
        {
            q: "Q2. 성형(얼굴)은 어떻게 표현할까?",
            opts: [
                { 
                    t: "무난한 기본 성형", 
                    c: 1.5, 
                    img: "https://via.placeholder.com/150/f8f9fa/2c3e50?text=Basic+Face",
                    avatarImg: "https://via.placeholder.com/140x160/edf2f7/2c3e50?text=Rete+Basic+Face",
                    speech: "편안하고 친근한 표정이 마음에 들어!"
                },
                { 
                    t: "인기 대세 성형", 
                    c: 4, 
                    img: "https://via.placeholder.com/150/fffaf0/d35400?text=Popular+Face",
                    avatarImg: "https://via.placeholder.com/140x160/fffaf0/d35400?text=Rete+Popular+Face",
                    speech: "눈빛이 훨씬 또렷하고 생기 있어 보여! 너무 예쁘다."
                },
                { 
                    t: "화려한 개성 성형", 
                    c: 8, 
                    img: "https://via.placeholder.com/150/f39c12/ffffff?text=Unique+Face",
                    avatarImg: "https://via.placeholder.com/140x160/f39c12/ffffff?text=Rete+Unique+Face",
                    speech: "독특하고 매력적이야! 다들 나한테 눈을 떼지 못하겠는걸?"
                }
            ]
        },
        {
            q: "Q3. 피부 톤 목표는 어떻게 잡을까?",
            opts: [
                { 
                    t: "기본 피부 유지", 
                    c: 0, 
                    img: "https://via.placeholder.com/150/f8f9fa/2c3e50?text=Default+Skin",
                    avatarImg: "https://via.placeholder.com/140x160/edf2f7/2c3e50?text=Rete+Default+Skin",
                    speech: "자연스러운 원래 피부 톤도 좋아!"
                },
                { 
                    t: "뽀송/홍조 꽃잎 피부", 
                    c: 2, 
                    img: "https://via.placeholder.com/150/fffaf0/d35400?text=Petal+Skin",
                    avatarImg: "https://via.placeholder.com/140x160/fffaf0/d35400?text=Rete+Petal+Skin",
                    speech: "피부가 발그레하고 생기 있어졌어! 꽃잎 같아."
                },
                { 
                    t: "뽀송/홍조 라벤더", 
                    c: 15, 
                    img: "https://via.placeholder.com/150/f39c12/ffffff?text=Lavender+Skin",
                    avatarImg: "https://via.placeholder.com/140x160/f39c12/ffffff?text=Rete+Lavender+Skin",
                    speech: "우와, 투명하고 영롱한 라벤더 빛 피부라니! 완전 신비로운 느낌이야."
                }
            ]
        },
        {
            q: "Q4. 무도회에 입고 갈 의상(한벌옷)은?",
            opts: [
                { 
                    t: "가성비 패키지 의상", 
                    c: 2, 
                    img: "https://via.placeholder.com/150/f8f9fa/2c3e50?text=Package",
                    avatarImg: "https://via.placeholder.com/140x160/edf2f7/2c3e50?text=Rete+Package+Outfit",
                    speech: "깔끔하고 단정한 의상이네. 부담 없이 입기 딱 좋아!"
                },
                { 
                    t: "인기 S라벨 의상", 
                    c: 10, 
                    img: "https://via.placeholder.com/150/fffaf0/d35400?text=Special+Label",
                    avatarImg: "https://via.placeholder.com/140x160/fffaf0/d35400?text=Rete+SLabel+Outfit",
                    speech: "역시 S라벨! 핏도 세련되고 무도회 분위기와 너무 잘 어울려."
                },
                { 
                    t: "희소 단종 명품 의상", 
                    c: 25, 
                    img: "https://via.placeholder.com/150/f39c12/ffffff?text=Rare+Outfit",
                    avatarImg: "https://via.placeholder.com/140x160/f39c12/ffffff?text=Rete+Rare+Outfit",
                    speech: "이건 구하기도 힘든 명품 옷이잖아?! 오늘 밤 주인공은 바로 나!"
                }
            ]
        },
        {
            q: "Q5. 손에 들 무기 코디는?",
            opts: [
                { 
                    t: "투명 / 기본 무기", 
                    c: 1, 
                    img: "https://via.placeholder.com/150/f8f9fa/2c3e50?text=Invisible",
                    avatarImg: "https://via.placeholder.com/140x160/edf2f7/2c3e50?text=Rete+Final+1",
                    speech: "의상이 더 돋보이도록 깔끔하게 정돈했어!"
                },
                { 
                    t: "인기 이펙트 무기", 
                    c: 8, 
                    img: "https://via.placeholder.com/150/fffaf0/d35400?text=Effect+Weapon",
                    avatarImg: "https://via.placeholder.com/140x160/fffaf0/d35400?text=Rete+Final+2",
                    speech: "반짝이는 이펙트 덕분에 움직일 때마다 빛이 나!"
                },
                { 
                    t: "단종/희귀 명품 무기", 
                    c: 20, 
                    img: "https://via.placeholder.com/150/f39c12/ffffff?text=Rare+Weapon",
                    avatarImg: "https://via.placeholder.com/140x160/f39c12/ffffff?text=Rete+Final+3",
                    speech: "압도적인 존재감이야! 최고의 완벽한 코디가 끝났어!"
                }
            ]
        }
    ];

    let currentIdx = 0;
    let selectedScores = [];

    function renderQuestion() {
        const q = questions[currentIdx];
        document.getElementById('progress').style.width = ((currentIdx) / questions.length * 100) + '%';
        document.getElementById('qa-number').innerText = `Step ${currentIdx + 1} / ${questions.length}`;
        document.getElementById('qa-text').innerText = q.q;

        const container = document.getElementById('qa-options');
        container.innerHTML = '';

        q.opts.forEach(opt => {
            const card = document.createElement('div');
            card.className = 'image-card';
            card.innerHTML = `
                <img src="${opt.img}" alt="${opt.t}" onerror="this.src='https://via.placeholder.com/150?text=No+Image'">
                <span>${opt.t}</span>
            `;
            
            // 옵션 클릭시: 상단 레테 캐릭터 이미지와 대사를 바꾼 뒤 다음 질문으로 넘어감
            card.onclick = () => {
                document.getElementById('avatar-img').src = opt.avatarImg;
                document.getElementById('rete-speech').innerText = `"${opt.speech}"`;
                
                selectedScores[currentIdx] = opt.c;
                currentIdx++;

                if (currentIdx < questions.length) {
                    renderQuestion();
                } else {
                    showResult();
                }
            };
            container.appendChild(card);
        });
    }

    function showResult() {
        document.getElementById('quiz-container').classList.add('hidden');
        document.getElementById('result-container').classList.remove('hidden');

        const totalScore = selectedScores.reduce((sum, val) => sum + val, 0);
        const minVal = Math.max(1, Math.floor(totalScore * 0.85));
        const maxVal = Math.ceil(totalScore * 1.15);

        document.getElementById('progress').style.width = '100%';
        document.getElementById('rete-speech').innerText = `"짜잔! 나와 함께 완성한 무도회 코디 어때? 이 코디를 만드는 데 약 ${minVal}~${maxVal}억 메소 정도가 필요할 것 같아!"`;

        document.getElementById('res-content').innerHTML = `
            <div class="feedback-item"><b>총 예상 견적:</b> 약 <b>${minVal} ~ ${maxVal}억 메소</b></div>
            <div class="feedback-item"><b>헤어/성형 예상:</b> 약 ${Math.round(totalScore * 0.3)}억 메소</div>
            <div class="feedback-item"><b>의상/무기 예상:</b> 약 ${Math.round(totalScore * 0.5)}억 메소</div>
            <div class="feedback-item"><b>피부/기타 예상:</b> 약 ${Math.round(totalScore * 0.2)}억 메소</div>
        `;
    }

    // 첫 실행
    renderQuestion();
</script>

</body>
</html>
